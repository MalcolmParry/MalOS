set timeout=3
set default=0

serial --unit=0 --speed=115200
terminal_output serial_com0
terminal_input serial_com0

menuentry "MalOS (VGA Text)" {
	multiboot2 (hd0,msdos1)/boot/kernel.elf
	module2 (hd0,msdos1)/boot/kernel_src.tar kernel_src_tar
	set gfxpayload=text
	boot
}

menuentry "MalOS (Framebuffer)" {
	multiboot2 (hd0,msdos1)/boot/kernel.elf
	module2 (hd0,msdos1)/boot/kernel_src.tar kernel_src_tar
	boot
}
